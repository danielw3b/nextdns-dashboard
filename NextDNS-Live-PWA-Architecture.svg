<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #090d16; }
      .box-bg { fill: #0f172a; stroke: #334155; stroke-width: 1.5px; rx: 8px; }
      .core-bg { fill: #1e293b; stroke: #38bdf8; stroke-width: 2px; rx: 8px; }
      .alert-bg { fill: #2a1215; stroke: #f87171; stroke-width: 1.5px; rx: 8px; }
      .text-title { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; }
      .text-body { fill: #f1f5f9; font-family: system-ui, sans-serif; font-size: 12px; }
      .text-muted { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 11px; }
      .line { stroke: #38bdf8; stroke-width: 1.5px; stroke-dasharray: 4 4; fill: none; }
      .line-solid { stroke: #4ade80; stroke-width: 1.5px; fill: none; }
      .arrow { fill: #38bdf8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- External Cloud API -->
  <g transform="translate(50, 40)">
    <rect width="200" height="70" class="box-bg" />
    <text x="100" y="30" text-anchor="middle" class="text-title">NextDNS REST API</text>
    <text x="100" y="50" text-anchor="middle" class="text-muted">Telemetry & Logs</text>
  </g>

  <!-- Telegram Alert API -->
  <g transform="translate(550, 40)">
    <rect width="200" height="70" class="alert-bg" />
    <text x="100" y="30" text-anchor="middle" class="text-title" style="fill: #f87171;">Telegram Bot API</text>
    <text x="100" y="50" text-anchor="middle" class="text-muted">Instant Push Alerts</text>
  </g>

  <!-- Core PWA Container -->
  <g transform="translate(50, 160)">
    <rect width="700" height="290" rx="12" fill="#0b1324" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" class="text-title">Single-File PWA Architecture</text>

    <!-- Buffer Storage -->
    <g transform="translate(30, 50)">
      <rect width="200" height="90" class="box-bg" />
      <text x="100" y="30" text-anchor="middle" class="text-title">STATE.logs Buffer</text>
      <text x="100" y="50" text-anchor="middle" class="text-body">Rotating Log Entries</text>
      <text x="100" y="68" text-anchor="middle" class="text-muted">Volatile RAM Storage</text>
    </g>

    <!-- Source of Truth Logic -->
    <g transform="translate(250, 50)">
      <rect width="200" height="90" class="core-bg" />
      <text x="100" y="30" text-anchor="middle" class="text-title">Source of Truth</text>
      <text x="100" y="50" text-anchor="middle" class="text-body">NextDNS > System</text>
      <text x="100" y="68" text-anchor="middle" class="text-muted">Blocked Override</text>
    </g>

    <!-- Frequency Guardrail -->
    <g transform="translate(470, 50)">
      <rect width="200" height="90" class="box-bg" />
      <text x="100" y="30" text-anchor="middle" class="text-title">Frequency Monitor</text>
      <text x="100" y="50" text-anchor="middle" class="text-body">Threshold Hit Counter</text>
      <text x="100" y="68" text-anchor="middle" class="text-muted">Auto-Alert Trigger</text>
    </g>

    <!-- Touch Gesture & UI -->
    <g transform="translate(30, 170)">
      <rect width="640" height="90" class="box-bg" />
      <text x="320" y="30" text-anchor="middle" class="text-title">Touch Events API & UI Layer</text>
      <text x="320" y="52" text-anchor="middle" class="text-body">Mobile Swipe Navigation | Throttled Controls</text>
      <text x="320" y="70" text-anchor="middle" class="text-muted">Cross-Platform Responsive Layout</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 150 110 L 150 210" class="line" marker-end="url(#arrow)" />
  <path d="M 570 210 L 650 110" class="line-solid" marker-end="url(#arrow)" />
</svg>