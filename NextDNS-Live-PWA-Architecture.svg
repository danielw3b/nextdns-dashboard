<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#090d16" />

  <!-- External Cloud API -->
  <g transform="translate(50, 40)">
    <rect width="200" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="100" y="30" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">NextDNS REST API</text>
    <text x="100" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Telemetry & Logs</text>
  </g>

  <!-- Telegram Alert API -->
  <g transform="translate(550, 40)">
    <rect width="200" height="70" rx="8" fill="#2a1215" stroke="#f87171" stroke-width="1.5" />
    <text x="100" y="30" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Telegram Bot API</text>
    <text x="100" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Instant Push Alerts</text>
  </g>

  <!-- Core PWA Container -->
  <g transform="translate(50, 160)">
    <rect width="700" height="290" rx="12" fill="#0b1324" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Single-File PWA Architecture</text>

    <!-- Buffer Storage -->
    <g transform="translate(30, 50)">
      <rect width="200" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="100" y="30" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">STATE.logs Buffer</text>
      <text x="100" y="50" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Rotating Log Entries</text>
      <text x="100" y="68" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Volatile RAM Storage</text>
    </g>

    <!-- Source of Truth Logic -->
    <g transform="translate(250, 50)">
      <rect width="200" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="100" y="30" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Source of Truth</text>
      <text x="100" y="50" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">NextDNS > System</text>
      <text x="100" y="68" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Blocked Override</text>
    </g>

    <!-- Frequency Guardrail -->
    <g transform="translate(470, 50)">
      <rect width="200" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="100" y="30" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Frequency Monitor</text>
      <text x="100" y="50" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Threshold Hit Counter</text>
      <text x="100" y="68" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Auto-Alert Trigger</text>
    </g>

    <!-- Touch Gesture & UI -->
    <g transform="translate(30, 170)">
      <rect width="640" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="320" y="30" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Touch Events API & UI Layer</text>
      <text x="320" y="52" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Mobile Swipe Navigation | Throttled Controls</text>
      <text x="320" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cross-Platform Responsive Layout</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 150 110 L 150 210" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <path d="M 570 210 L 650 110" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>